<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Create your CLINERVE account</title>
  <link rel="stylesheet" href="backend.css">
</head>
<body>
  <main class="cl-shell">
    <a class="cl-brand" href="index.html">CLINERVE<span>.</span></a>

    <section class="cl-panel">
      <p class="cl-muted">YOUR NEXT EXPERIENCE STARTS HERE</p>
      <h1>Create your account</h1>
      <p class="cl-muted">
        Join CLINERVE to manage your visit requests and experiences.
      </p>

      <p id="signup-message" class="cl-message" role="status"
         aria-live="polite"></p>

      <form id="signup-form" class="cl-form">
        <div class="cl-field">
          <label for="signup-name">Full name</label>
          <input id="signup-name" name="name"
                 autocomplete="name" required maxlength="100">
        </div>

        <div class="cl-field">
          <label for="signup-email">Email address</label>
          <input id="signup-email" name="email" type="email"
                 autocomplete="email" required maxlength="254">
        </div>

        <div class="cl-field">
          <label for="signup-password">Password</label>
          <input id="signup-password" name="password" type="password"
                 autocomplete="new-password" minlength="8"
                 required>
          <small class="cl-help">Use at least 8 characters.</small>
        </div>

        <div class="cl-field">
          <label for="signup-confirm">Confirm password</label>
          <input id="signup-confirm" name="confirmPassword" type="password"
                 autocomplete="new-password" minlength="8" required>
        </div>

        <button id="signup-submit" class="cl-button" type="submit">
          Create account
        </button>
      </form>
      
<div class="cl-social-login">
  <p class="cl-muted">Or create an account with</p>

  <button
    class="cl-button cl-button-secondary"
    type="button"
    data-oauth-provider="google">
    Continue with Google
  </button>

  <button
    class="cl-button cl-button-secondary"
    type="button"
    data-oauth-provider="github">
    Continue with GitHub
  </button>
</div>
      
      <p class="cl-footer">
        Already have an account? <a href="login.html">Sign in</a>.
      </p>
      <p class="cl-footer">
        You can explore the website without creating an account.
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
</body>
</html>
