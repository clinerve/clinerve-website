<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Reset password — CLINERVE</title>
  <link rel="stylesheet" href="backend.css">
</head>

<body>
  <main class="cl-shell">
    <a class="cl-brand" href="index.html">
      CLINERVE<span>.</span>
    </a>

    <section class="cl-panel">
      <p class="cl-muted">ACCOUNT SECURITY</p>

      <h1>Reset your password</h1>

      <p class="cl-muted">
        Choose a new password for your CLINERVE account.
      </p>

      <p
        id="reset-message"
        class="cl-message"
        role="status"
        aria-live="polite"
      ></p>

      <form id="reset-form" class="cl-form" hidden>
        <div class="cl-field">
          <label for="reset-password">New password</label>

          <input
            id="reset-password"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <div class="cl-field">
          <label for="reset-confirm">Confirm new password</label>

          <input
            id="reset-confirm"
            type="password"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button class="cl-button" type="submit">
          Update password
        </button>
      </form>

      <p class="cl-footer">
        <a href="login.html">Return to sign in</a>
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-client.js"></script>
  <script src="auth.js"></script>
</body>
</html>
